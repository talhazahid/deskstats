name: Build and verify Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/installer-validation.yml'
      - 'installer/installer.iss'
      - 'scripts/build-release.ps1'
      - 'scripts/verify-store-installer.ps1'
      - 'src/**'
      - 'tests/SysDash.SetupChecks/**'

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        edition: [website, deferred]
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RELEASE_VERSION: '1.0.4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install installer compiler
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build installer
        shell: pwsh
        run: |
          if ('${{ matrix.edition }}' -eq 'deferred') {
            ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION -DeferredDriver
          } else {
            ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION
          }
      - name: Verify silent installation and installed-app metadata
        shell: pwsh
        run: |
          if ('${{ matrix.edition }}' -eq 'deferred') {
            ./scripts/verify-store-installer.ps1 -Installer "artifacts/DeskStats-Store-Setup-$env:RELEASE_VERSION.exe" -ExpectedVersion $env:RELEASE_VERSION -RequireFreshInstall -DeferredDriver
          } else {
            ./scripts/verify-store-installer.ps1 -Installer "artifacts/DeskStats-Setup-$env:RELEASE_VERSION.exe" -ExpectedVersion $env:RELEASE_VERSION -RequireFreshInstall
          }
      - name: Verify onboarding and explicitly requested driver installation
        if: matrix.edition == 'deferred'
        shell: pwsh
        run: dotnet run --project tests/SysDash.SetupChecks -c Release -- artifacts/setup-qa --install-driver
      - name: Verify reinstall with existing PawnIO
        shell: pwsh
        run: |
          if ('${{ matrix.edition }}' -eq 'deferred') {
            ./scripts/verify-store-installer.ps1 -Installer "artifacts/DeskStats-Store-Setup-$env:RELEASE_VERSION.exe" -ExpectedVersion $env:RELEASE_VERSION
          } else {
            ./scripts/verify-store-installer.ps1 -Installer "artifacts/DeskStats-Setup-$env:RELEASE_VERSION.exe" -ExpectedVersion $env:RELEASE_VERSION
          }
      - name: Verify uninstall preserves shared driver and user settings
        shell: pwsh
        run: |
          $settingsDir = Join-Path $env:LOCALAPPDATA 'DeskStats'
          New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null
          $sentinel = Join-Path $settingsDir 'installer-qa.txt'
          Set-Content -LiteralPath $sentinel 'preserve user settings'
          $appDir = Join-Path $env:ProgramFiles 'DeskStats'
          $process = Start-Process -FilePath (Join-Path $appDir 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -PassThru -Wait
          $result = @{
            ExitCode = $process.ExitCode
            AppRemoved = -not (Test-Path (Join-Path $appDir 'DeskStats.exe'))
            AppEntryRemoved = -not (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{3F0A2E9C-7B1D-4C5A-8F6E-2D9B0A1C4E5F}_is1')
            SharedDriverPreserved = Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Services\PawnIO'
            UserSettingsPreserved = Test-Path -LiteralPath $sentinel
          }
          $result | ConvertTo-Json | Set-Content artifacts/store-validation/uninstall-result.json
          if ($result.ExitCode -ne 0 -or -not $result.AppRemoved -or -not $result.AppEntryRemoved -or -not $result.SharedDriverPreserved -or -not $result.UserSettingsPreserved) { throw 'Uninstall verification failed.' }
      - name: Save verified installer
        uses: actions/upload-artifact@v4
        with:
          name: DeskStats-1.0.4-${{ matrix.edition }}
          path: artifacts/*Setup-1.0.4.exe
          if-no-files-found: error
      - name: Save verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-validation-logs-${{ matrix.edition }}
          path: |
            artifacts/store-validation/
            artifacts/setup-qa/
          if-no-files-found: ignore
