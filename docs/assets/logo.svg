<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#26385A"/>
      <stop offset="0.55" stop-color="#121C33"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.6" stop-color="#3B9BFF"/>
      <stop offset="1" stop-color="#6D7CFF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#4FE3F7"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="6" y="6" width="244" height="244" rx="58" fill="url(#tile)"/>
  <rect x="6" y="6" width="244" height="244" rx="58" fill="url(#glow)"/>
  <rect x="6" y="6" width="244" height="244" rx="58" fill="url(#sheen)"/>
  <rect x="7.5" y="7.5" width="241" height="241" rx="56.5" fill="none" stroke="#9CC4FF" stroke-opacity="0.28" stroke-width="3"/>
  <!-- ring: track + glow + arc -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="18"/>
  <circle cx="128" cy="128" r="78" fill="none" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round"
          stroke-dasharray="367.6 490.1" transform="rotate(-90 128 128)" filter="url(#soft)"/>
  <circle cx="128" cy="128" r="78" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round"
          stroke-dasharray="367.6 490.1" transform="rotate(-90 128 128)"/>
  <!-- bars -->
  <g>
    <rect x="92"  y="124" width="20" height="44" rx="6.5" fill="url(#bar)"/>
    <rect x="118" y="104" width="20" height="64" rx="6.5" fill="url(#bar)"/>
    <rect x="144" y="84"  width="20" height="84" rx="6.5" fill="url(#bar)"/>
    <rect x="92"  y="124" width="20" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="118" y="104" width="20" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="144" y="84"  width="20" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
  </g>
</svg>
